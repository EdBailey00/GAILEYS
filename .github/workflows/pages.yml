name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching the machine the lockfile is written on. Node 22 ships
          # npm 10, which rejects an npm 11 lockfile as incomplete, and the
          # Capacitor CLI will not install on Node 20 at all.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the app from /GAILEYS/. The Android build leaves this
          # unset so the same code loads from inside the apk.
          NEXT_PUBLIC_BASE_PATH: /GAILEYS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
