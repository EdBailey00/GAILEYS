name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, matching the machine the lockfile is written on. Node 22 ships
          # npm 10, which rejects an npm 11 lockfile as incomplete, and the
          # Capacitor CLI will not install on Node 20 at all.
          node-version: 24
          cache: npm

      # One block, everything captured, so a failure can be read afterwards
      # rather than guessed at. Pages serves the app from /GAILEYS/; the
      # Android build leaves that variable unset.
      - name: Build it
        env:
          NEXT_PUBLIC_BASE_PATH: /GAILEYS
        run: |
          set -o pipefail
          {
            echo "--- node $(node -v), npm $(npm -v) ---"
            # npm install, not npm ci. npm prunes platform-specific optional
            # dependencies when it writes the lockfile, so a lockfile written
            # on Windows is missing the linux-only pieces (@emnapi/*) that
            # npm ci refuses to install without. install resolves what this
            # platform actually needs and still honours the pinned versions.
            npm install --no-audit --no-fund
            npm run build
          } 2>&1 | tee /tmp/ci.log

      # The failure reports are mine, not real issues. Clear them once green.
      - name: Clear old failure reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search 'build failed in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment 'Green again on run ${{ github.run_number }}.'
          done

      - name: Say why it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run ${{ github.run_number }} of the Pages build failed."
            echo
            echo '```'
            tail -n 120 /tmp/ci.log 2>/dev/null || echo "no log captured"
            echo '```'
          } > /tmp/body.md
          gh issue create --title "Pages build failed (run ${{ github.run_number }})" --body-file /tmp/body.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
