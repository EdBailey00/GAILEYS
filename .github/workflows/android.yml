name: Build the Android app

# Every push to main produces an installable apk and publishes it as a release.
# To put it on a phone: open the release page on the phone, tap the apk, and
# allow installs from that source when Android asks.
#
# It is debug-signed, which is all a sideloaded app needs. The board lives on
# the server now, so if a signing change ever forces an uninstall, nothing is
# lost: sign back in and the whole board comes down again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching the machine the lockfile is written on. Node 22 ships
          # npm 10, which rejects an npm 11 lockfile as incomplete, and the
          # Capacitor CLI will not install on Node 20 at all.
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # No NEXT_PUBLIC_BASE_PATH here on purpose: inside the apk the files are
      # served from the root, not from /GAILEYS/.
      - run: npm run build

      - run: npx cap sync android

      - run: chmod +x gradlew
        working-directory: android

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: bragging-rights-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish it where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk bragging-rights.apk
          gh release create "app-${{ github.run_number }}" bragging-rights.apk \
            --title "Bragging Rights build ${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap the apk to install."
