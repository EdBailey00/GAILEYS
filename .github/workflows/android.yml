name: Build the Android app

# Every push to main produces an installable apk and publishes it as a release.
# To put it on a phone: open the release page on the phone, tap the apk, and
# allow installs from that source when Android asks.
#
# The apk is a shell around the deployed site rather than a copy of it, so it
# only needs installing once: after that every push reaches it the same second
# it reaches the browser. A new apk is still published each time because the
# native side of it can change, but installing one is no longer how updates
# arrive.
#
# It is debug-signed, which is all a sideloaded app needs. The board lives on
# the server now, so if a signing change ever forces an uninstall, nothing is
# lost: pick your name again and the whole board comes down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching the machine the lockfile is written on. Node 22 ships
          # npm 10, which rejects an npm 11 lockfile as incomplete, and the
          # Capacitor CLI will not install on Node 20 at all.
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # One block, everything captured, so a failure can be read afterwards
      # rather than guessed at. No NEXT_PUBLIC_BASE_PATH on purpose: inside the
      # apk the files are served from the root, not from /GAILEYS/.
      - name: Build it
        run: |
          set -o pipefail
          {
            echo "--- node $(node -v), npm $(npm -v) ---"
            # npm install, not npm ci. npm prunes platform-specific optional
            # dependencies when it writes the lockfile, so a lockfile written
            # on Windows is missing the linux-only pieces (@emnapi/*) that
            # npm ci refuses to install without. install resolves what this
            # platform actually needs and still honours the pinned versions.
            npm install --no-audit --no-fund
            npm run build
            npx cap sync android
            chmod +x android/gradlew
            (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)
          } 2>&1 | tee /tmp/ci.log

      # The failure reports are mine, not real issues. Clear them once green.
      - name: Clear old failure reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search 'build failed in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment 'Green again on run ${{ github.run_number }}.'
          done

      - name: Say why it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run ${{ github.run_number }} of the Android build failed."
            echo
            echo '```'
            tail -n 120 /tmp/ci.log 2>/dev/null || echo "no log captured"
            echo '```'
          } > /tmp/body.md
          gh issue create --title "Android build failed (run ${{ github.run_number }})" --body-file /tmp/body.md

      - uses: actions/upload-artifact@v4
        with:
          name: bragging-rights-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish it where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version the app shows at the bottom of its own screen, so the
          # releases page and the phone agree on which push this is.
          ver=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/lib/version.ts)
          mv android/app/build/outputs/apk/debug/app-debug.apk bragging-rights.apk
          gh release create "app-${{ github.run_number }}" bragging-rights.apk \
            --title "$ver (shell)" \
            --notes "Only needed once. This apk is a shell around https://edbailey00.github.io/GAILEYS/, so it is always on whatever was last pushed and updates without being reinstalled. Built at $ver. Reinstall only if the native side changes or the app will not open."
